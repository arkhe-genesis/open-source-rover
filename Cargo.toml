[package]
name = "arkhe-safe-manifold"
version = "0.8.0"
edition = "2021"
description = "SafeManifold v0.8.0"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"], optional = true }
uuid = { version = "1.10", features = ["v4"], optional = true }
indexmap = { version = "2.0", optional = true }
tempfile = "3"

[dev-dependencies]
proptest = "1.6"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"

[features]
default = []
prolog = []
audit = ["chrono", "uuid"]
recovery = ["indexmap"]
mssp = ["audit"]
pqc = []
async = []
nist = []
iso42001 = []
agentic = []
eu_ai_act = []
supply_chain = []
bias = []
explainability = ["chrono"]
full = ["audit", "recovery", "mssp", "prolog", "pqc", "async",
        "nist", "iso42001", "agentic", "eu_ai_act", "supply_chain",
        "bias", "explainability"]
